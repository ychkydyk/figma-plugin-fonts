<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Шрифты проекта</title>
<style>
  /* VOLT Studio brand theme */
  :root {
    --bg: #0A0A0A;
    --bg-soft: #111111;
    --bg-card: #1A1A1A;
    --border: #222222;
    --text: #FFFFFF;
    --text2: #CCCCCC;
    --text-soft: #888888;
    --accent: #C8FF00;
    --accent-text: #0A0A0A;
    --warn: #FF4733;
    --ok: #C8FF00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 12px/1.5 Inter, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  /* VOLT brand header */
  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
  }
  .brand-mark::before {
    content: "";
    display: inline-block;
    width: 22px;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .brand-tag {
    font-size: 9px;
    color: var(--text-soft);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 100px;
  }

  header {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 11px 8px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    border-bottom: 2px solid transparent;
    color: var(--text-soft);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text2); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--bg);
  }
  .toolbar {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--bg);
  }
  .toolbar input[type="text"], .toolbar input[type="search"] {
    flex: 1;
    min-width: 120px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .toolbar input[type="text"]:focus, .toolbar input[type="search"]:focus {
    border-color: var(--accent);
  }
  .toolbar input[type="number"] {
    width: 60px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--text);
    font-family: inherit;
    outline: none;
  }
  .toolbar input[type="number"]:focus { border-color: var(--accent); }

  button {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover { background: var(--bg-card); color: var(--text); border-color: #333; }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  button.primary:hover { background: #D4FF33; border-color: #D4FF33; box-shadow: 0 0 16px rgba(200,255,0,0.3); }
  button.ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .seg-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-soft);
  }
  .seg-group .seg {
    padding: 7px 11px;
    border: 0;
    border-right: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    color: var(--text-soft);
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .seg-group .seg:last-child { border-right: 0; }
  .seg-group .seg.active { background: var(--accent); color: var(--accent-text); }
  .seg-group .seg:disabled { opacity: 0.4; cursor: not-allowed; }
  .scope-info {
    padding: 8px 14px;
    font-size: 10px;
    color: var(--text-soft);
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 80px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #2c2c2c; }
  .card.open { border-color: #2c2c2c; }
  .card-head {
    padding: 11px 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .card-head:hover { background: rgba(255,255,255,0.02); }
  .bulk-btn {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg-soft);
    color: var(--text-soft);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.12s;
  }
  .bulk-btn:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .filter-toggle {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--text-soft);
    font-size: 10px;
    cursor: pointer;
    user-select: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    font-family: inherit;
  }
  .filter-toggle:hover { color: var(--text); border-color: #333; }
  .filter-toggle.active { background: var(--warn); color: white; border-color: var(--warn); }
  .family-name {
    flex: 1;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -0.01em;
  }
  .badge {
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 100px;
    background: var(--bg-soft);
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .badge.ok { background: rgba(200,255,0,0.1); color: var(--accent); border-color: rgba(200,255,0,0.3); }
  .badge.miss { background: rgba(255,71,51,0.1); color: var(--warn); border-color: rgba(255,71,51,0.3); }
  .badge.user { background: rgba(200,255,0,0.08); color: var(--accent); border-color: rgba(200,255,0,0.2); }
  .card-body {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: none;
  }
  .card.open .card-body { display: block; }
  .card.open .chev { transform: rotate(90deg); }
  .chev { transition: transform 0.15s; color: var(--text-soft); }
  .style-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-top: 1px dashed var(--border);
  }
  .style-row:first-child { border-top: 0; }
  .style-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    width: 130px;
    cursor: pointer;
  }
  .style-row input[type="checkbox"] { margin: 0; }
  .style-meta {
    font-size: 11px;
    color: var(--text-soft);
  }
  .preview {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 18px;
    color: var(--text);
    min-height: 1.2em;
  }
  .preview.loading { color: var(--text-soft); font-style: italic; }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 11px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .footer-info {
    flex: 1;
    color: var(--text-soft);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .footer-info b { color: var(--accent); font-weight: 700; }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-soft);
  }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 36px 16px;
    text-align: center;
    color: var(--text-soft);
    cursor: pointer;
    background: var(--bg-soft);
    transition: all 0.15s;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .drop-zone:hover { border-color: var(--accent); color: var(--accent); }
  .drop-zone.drag { border-color: var(--accent); color: var(--accent); background: rgba(200,255,0,0.05); }
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
    max-width: 460px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--accent);
  }
  .modal p, .modal li { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .modal ol, .modal ul { padding-left: 20px; }
  .modal code {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--accent);
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .progress-bar {
    height: 2px;
    background: var(--bg-soft);
    overflow: hidden;
    flex-shrink: 0;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s;
    width: 0%;
    box-shadow: 0 0 8px var(--accent);
  }
  .hidden { display: none !important; }
  .row-spread { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
</style>
</head>
<body>

<div class="brand">
  <span class="brand-mark">VOLT · FONTS</span>
  <span class="brand-tag">v0.3 · made with ⚡</span>
</div>

<header>
  <div class="tab active" data-tab="project">Проект</div>
  <div class="tab" data-tab="catalog">Каталог</div>
  <div class="tab" data-tab="upload">ZIP</div>
</header>

<div class="toolbar">
  <div class="seg-group" id="scope-group">
    <button class="seg active" data-scope="document" title="Все шрифты во всех страницах документа">📄 Документ</button>
    <button class="seg" data-scope="selection" title="Только шрифты в выделенных слоях/фреймах">🎯 Выделение</button>
  </div>
  <input type="search" id="search" placeholder="Поиск…" />
  <input type="text" id="sample" placeholder="Текст превью" value="Съешь же ещё этих мягких французских булок 0123" />
  <input type="number" id="size" min="10" max="64" value="22" title="Размер превью" />
  <button id="missing-only" class="filter-toggle" title="Показать только семейства, которых не хватает в системе">⚠ нехватка</button>
  <button id="rescan" title="Пересканировать">↻</button>
</div>

<div class="scope-info" id="scope-info"></div>
<div class="progress-bar"><div id="progress"></div></div>

<main id="main">
  <div class="empty">Сканирую документ…</div>
</main>

<footer>
  <div class="footer-info" id="info">Выбрано: 0</div>
  <button id="clear" class="ghost" title="Снять весь выбор">Сброс</button>
  <button id="download" title="Скачать архив со всеми выбранными шрифтами">ZIP</button>
  <button id="install" class="primary" disabled title="Установить выбранные шрифты прямо в систему (без архива)">⚡ Установить</button>
</footer>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Готово</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="primary" id="modal-close">Понятно</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="find-modal-bg">
  <div class="modal" style="max-width:520px">
    <h3>🔎 Найти «<span id="find-modal-name"></span>»</h3>
    <div id="find-modal-status" style="font-size:12px;color:var(--text-soft);margin-bottom:10px">Ищу в открытых каталогах…</div>
    <div id="find-modal-results" style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;margin-bottom:10px"></div>
    <details style="margin-top:6px">
      <summary style="cursor:pointer;font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;padding:6px 0">Ничего не подошло? Поискать на сайтах вручную</summary>
      <div id="find-modal-links" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    </details>
    <p style="margin-top:14px;color:var(--text-soft);font-size:11px">Если шрифт коммерческий и нашёл его файл сам — перетащи <code>.ttf</code>/<code>.otf</code> во вкладку <b>ZIP</b>.</p>
    <div class="modal-actions">
      <button class="primary" id="find-modal-close">Закрыть</button>
    </div>
  </div>
</div>

// =============================================================
//  STATE
// =============================================================
const state = {
  tab: "project",
  scope: "document",        // "document" | "selection"
  scan: {
    document: [],           // [{family, usedStyles:[{weight,style,figmaStyle,available,count}]}]
    selection: null,
    selectionCount: 0,
    pageName: ""
  },
  catalog: STARTER_CATALOG,
  uploaded: [],
  search: "",
  sample: "Съешь же ещё этих мягких французских булок 0123",
  size: 22,
  selected: new Map(),       // key "family__weight__style" -> {family, weight, style, source, url?, name?, bytes?}
  userTouched: new Set(),    // ключи, по которым пользователь снимал/ставил вручную — не пересчитываем авто
  loadedFontFaces: new Set(),
  filterMissingOnly: false,  // показывать только семейства с missing-стилями
  sampleEdited: false,       // юзер вручную трогал поле «текст превью» — больше не подменяем сэмплом из selection
  selectionSample: ""        // последний сэмпл текста из выделения (приходит из code.js)
};

function currentProjectFonts() {
  if (state.scope === "selection" && state.scan.selection) return state.scan.selection;
  return state.scan.document;
}
function nearestWeight(available, target) {
  if (!available.length) return target;
  return available.reduce((best, w) => Math.abs(w - target) < Math.abs(best - target) ? w : best);
}

// =============================================================
//  CRC32 + STORE-ZIP WRITER
// =============================================================
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTime(d) {
  return ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((Math.floor(d.getSeconds() / 2)) & 0x1F);
}
function dosDate(d) {
  return (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0x0F) << 5) | (d.getDate() & 0x1F);
}
// entries: [{name: string, data: Uint8Array}]
function buildZip(entries) {
  const enc = new TextEncoder();
  const now = new Date();
  const t = dosTime(now), d = dosDate(now);
  const local = []; const central = []; let offset = 0;
  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data);
    const size = e.data.length;

    // local file header
    const lh = new Uint8Array(30 + nameBytes.length);
    const dvL = new DataView(lh.buffer);
    dvL.setUint32(0, 0x04034b50, true);
    dvL.setUint16(4, 20, true);          // version needed
    dvL.setUint16(6, 0x0800, true);      // gp flag (UTF-8 names)
    dvL.setUint16(8, 0, true);           // compression = STORE
    dvL.setUint16(10, t, true);
    dvL.setUint16(12, d, true);
    dvL.setUint32(14, crc, true);
    dvL.setUint32(18, size, true);       // compressed size
    dvL.setUint32(22, size, true);       // uncompressed size
    dvL.setUint16(26, nameBytes.length, true);
    dvL.setUint16(28, 0, true);          // extra
    lh.set(nameBytes, 30);
    local.push(lh, e.data);

    // central directory header
    const ch = new Uint8Array(46 + nameBytes.length);
    const dvC = new DataView(ch.buffer);
    dvC.setUint32(0, 0x02014b50, true);
    dvC.setUint16(4, 20, true);          // version made by
    dvC.setUint16(6, 20, true);          // version needed
    dvC.setUint16(8, 0x0800, true);
    dvC.setUint16(10, 0, true);
    dvC.setUint16(12, t, true);
    dvC.setUint16(14, d, true);
    dvC.setUint32(16, crc, true);
    dvC.setUint32(20, size, true);
    dvC.setUint32(24, size, true);
    dvC.setUint16(28, nameBytes.length, true);
    dvC.setUint16(30, 0, true);
    dvC.setUint16(32, 0, true);
    dvC.setUint16(34, 0, true);
    dvC.setUint16(36, 0, true);
    dvC.setUint32(38, 0, true);          // ext attrs
    dvC.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);

    offset += lh.length + e.data.length;
  }
  const centralStart = offset;
  let centralSize = 0;
  for (const c of central) centralSize += c.length;

  const eocd = new Uint8Array(22);
  const dvE = new DataView(eocd.buffer);
  dvE.setUint32(0, 0x06054b50, true);
  dvE.setUint16(8, entries.length, true);
  dvE.setUint16(10, entries.length, true);
  dvE.setUint32(12, centralSize, true);
  dvE.setUint32(16, centralStart, true);

  // склейка
  const total = centralStart + centralSize + 22;
  const out = new Uint8Array(total);
  let p = 0;
  for (const part of local) { out.set(part, p); p += part.length; }
  for (const part of central) { out.set(part, p); p += part.length; }
  out.set(eocd, p);
  return out;
}

// =============================================================
//  ZIP READER (STORE + DEFLATE через DecompressionStream)
// =============================================================
async function readZip(arrayBuffer) {
  const u8 = new Uint8Array(arrayBuffer);
  const dv = new DataView(u8.buffer);

  // ищем EOCD c конца (последние 65557 байт)
  const max = Math.max(0, u8.length - 65557);
  let eocd = -1;
  for (let i = u8.length - 22; i >= max; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP: EOCD не найден");
  const totalEntries = dv.getUint16(eocd + 10, true);
  const centralSize = dv.getUint32(eocd + 12, true);
  const centralOffset = dv.getUint32(eocd + 16, true);
  if (centralOffset + centralSize > u8.length) throw new Error("ZIP: повреждённый central directory");

  const dec = new TextDecoder();
  const files = [];
  let p = centralOffset;
  for (let i = 0; i < totalEntries; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("ZIP: bad central header");
    const compMethod = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const uncSize = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;

    // local header → пропускаем фиксированную часть + nameLen + extraLen
    const lhNameLen = dv.getUint16(localOffset + 26, true);
    const lhExtraLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lhNameLen + lhExtraLen;
    const compressed = u8.subarray(dataStart, dataStart + compSize);

    let data;
    if (compMethod === 0) {
      data = compressed;
    } else if (compMethod === 8) {
      // DEFLATE-raw через DecompressionStream
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([compressed]).stream().pipeThrough(ds);
      const blob = await new Response(stream).blob();
      data = new Uint8Array(await blob.arrayBuffer());
    } else {
      console.warn("ZIP: неподдерживаемый метод компрессии", compMethod, name);
      continue;
    }
    if (data.length !== uncSize) console.warn("ZIP: размер не совпал для", name);
    files.push({ name, data });
  }
  return files;
}

// =============================================================
//  FONT FETCHING (multi-source) + PREVIEW (FontFace API)
//  google    → Fontsource на jsdelivr (детерминированный URL по slug+subset+w+s)
//  fontshare → CSS API парсит .ttf-урлы (несколько за один запрос)
// =============================================================
function googleFontUrl(slug, subset, weight, style) {
  return `https://cdn.jsdelivr.net/fontsource/fonts/${slug}@latest/${subset}-${weight}-${style}.ttf`;
}
function subsetFor(cat) {
  return (cat.subsets && cat.subsets.includes("cyrillic")) ? "cyrillic" : "latin";
}

const fontshareCssCache = new Map(); // slug → Map<"w__s", ttfUrl>
async function fontshareResolve(slug, weights) {
  const cacheKey = slug + ":" + weights.slice().sort((a, b) => a - b).join(",");
  if (fontshareCssCache.has(cacheKey)) return fontshareCssCache.get(cacheKey);
  const cssUrl = `https://api.fontshare.com/v2/css?f[]=${slug}@${weights.join(",")}`;
  console.log("[fonts-plugin] fontshare CSS", cssUrl);
  const r = await fetch(cssUrl);
  if (!r.ok) throw new Error(`Fontshare HTTP ${r.status}`);
  const css = await r.text();
  const map = new Map();
  const blocks = css.split("@font-face").slice(1);
  for (const block of blocks) {
    const wm = block.match(/font-weight:\s*(\d+)/);
    const sm = block.match(/font-style:\s*([a-z]+)/i);
    const um = block.match(/url\s*\(\s*['"]?([^'")\s]+\.ttf)['"]?\s*\)/i);
    if (wm && um) {
      const w = +wm[1];
      const s = (sm && sm[1].toLowerCase() === "italic") ? "italic" : "normal";
      map.set(`${w}__${s}`, um[1]);
    }
  }
  fontshareCssCache.set(cacheKey, map);
  return map;
}

async function resolveCatalogUrl(cat, weight, style) {
  if (cat.source === "fontshare") {
    const map = await fontshareResolve(cat.slug, cat.weights);
    const url = map.get(`${weight}__${style}`);
    if (!url) throw new Error(`Fontshare ${cat.family}: вариант ${weight}/${style} не найден`);
    return url;
  }
  return googleFontUrl(cat.slug, subsetFor(cat), weight, style);
}

// =============================================================
//  ВАЛИДАЦИЯ + ЛИМИТЫ
// =============================================================
const MAX_FILE_BYTES = 10 * 1024 * 1024;   // 10 MB на один шрифт
const MAX_TOTAL_BYTES = 50 * 1024 * 1024;  // 50 MB на ZIP

// Magic-bytes для font-форматов:
//   .ttf TrueType:    00 01 00 00
//   .ttf TT Apple:    74 72 75 65 ("true")
//   .otf OpenType:    4F 54 54 4F ("OTTO")
//   .woff:            77 4F 46 46 ("wOFF")
//   .woff2:           77 4F 46 32 ("wOF2")
//   .ttc TrueType Collection: 74 74 63 66 ("ttcf")
function isFontMagic(bytes) {
  if (!bytes || bytes.length < 4) return false;
  const b0 = bytes[0], b1 = bytes[1], b2 = bytes[2], b3 = bytes[3];
  if (b0 === 0x00 && b1 === 0x01 && b2 === 0x00 && b3 === 0x00) return "ttf";
  if (b0 === 0x74 && b1 === 0x72 && b2 === 0x75 && b3 === 0x65) return "ttf-apple";
  if (b0 === 0x4F && b1 === 0x54 && b2 === 0x54 && b3 === 0x4F) return "otf";
  if (b0 === 0x77 && b1 === 0x4F && b2 === 0x46 && b3 === 0x46) return "woff";
  if (b0 === 0x77 && b1 === 0x4F && b2 === 0x46 && b3 === 0x32) return "woff2";
  if (b0 === 0x74 && b1 === 0x74 && b2 === 0x63 && b3 === 0x66) return "ttc";
  return false;
}

// Защита от path traversal в именах из user-ZIP: убираем все ".." и абсолютные пути.
function sanitizeArchivePath(name) {
  return String(name)
    .replace(/\\/g, "/")
    .split("/")
    .filter(seg => seg && seg !== "." && seg !== "..")
    .join("/");
}

const fetchCache = new Map(); // url -> Promise<Uint8Array>
function fetchFont(url) {
  if (fetchCache.has(url)) return fetchCache.get(url);
  const p = fetch(url).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} для ${url}`);
    const len = +r.headers.get("content-length");
    if (len && len > MAX_FILE_BYTES) {
      throw new Error(`Файл слишком большой (${(len/1024/1024).toFixed(1)} MB > ${MAX_FILE_BYTES/1024/1024} MB)`);
    }
    return r.arrayBuffer();
  }).then(b => {
    const bytes = new Uint8Array(b);
    if (bytes.length > MAX_FILE_BYTES) {
      throw new Error(`Файл слишком большой: ${(bytes.length/1024/1024).toFixed(1)} MB`);
    }
    if (!isFontMagic(bytes)) {
      throw new Error(`Не похоже на шрифт (плохие magic bytes) — отказано в загрузке для безопасности`);
    }
    return bytes;
  });
  fetchCache.set(url, p);
  // если упало — убираем из кеша, чтобы можно было ретраить
  p.catch(() => fetchCache.delete(url));
  return p;
}

async function ensureFontFace(family, weight, style, bytes) {
  const cssFamily = `__pf_${family.replace(/[^a-zA-Z0-9]/g, "_")}_${weight}_${style}`;
  if (state.loadedFontFaces.has(cssFamily)) return cssFamily;
  const ff = new FontFace(cssFamily, bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), { style, weight: String(weight) });
  await ff.load();
  document.fonts.add(ff);
  state.loadedFontFaces.add(cssFamily);
  return cssFamily;
}

function familyMatchesCatalog(family) {

function renderProject(term) {

function renderProjectStyles(cat, usedStyles) {
  const subset = subsetFor(cat);
  const rows = [];
  for (const u of usedStyles) {
    const w = nearestWeight(cat.weights, u.weight);
    const s = cat.styles.includes(u.style) ? u.style : "normal";
    const url = cat.source === "google" ? googleFontUrl(cat.slug, subset, w, s) : "";
    const key = selKey(cat.family, w, s);
    const sel = state.selected.has(key);
    const exact = (w === u.weight) && (s === u.style);
    const note = exact
      ? `<span class="style-meta">${escape(u.figmaStyle)}</span>`
      : `<span class="style-meta" title="В каталоге нет точного веса ${u.weight}, взят ближайший ${w}">${escape(u.figmaStyle)} → ${weightLabel(w)}</span>`;
    const availBadge = u.available
      ? `<span class="badge ok">в ОС</span>`
      : `<span class="badge miss">нужен</span>`;
    rows.push(`
      <div class="style-row" data-row data-family="${escape(cat.family)}" data-vendor="${cat.source}" data-slug="${cat.slug}" data-subset="${subset}" data-weight="${w}" data-style="${s}" data-url="${url}" data-source="catalog">
        <label>
          <input type="checkbox" ${sel ? "checked" : ""} />
          <span>${weightLabel(w)} ${s === "italic" ? "Italic" : ""}</span>

        ${note}
        <div class="preview loading" data-preview>загружаю превью…</div>
      </div>`);
  }
  return rows.join("");
}

function renderFullCatalogStyles(cat) {

function weightLabel(w) {
  const m = { 100: "Thin", 200: "ExtraLight", 300: "Light", 400: "Regular", 500: "Medium", 600: "SemiBold", 700: "Bold", 800: "ExtraBold", 900: "Black", 1000: "ExtraBlack" };
  return m[w] || String(w);
}
function parseStyle(figmaStyle) {
  // Figma style: "Bold", "Bold Italic", "Light", "300", "300 Italic", "Italic"
  const lower = figmaStyle.toLowerCase();
  const italic = lower.includes("italic") || lower.includes("oblique");
  let weight = 400;
  const map = { thin: 100, hairline: 100, extralight: 200, ultralight: 200, light: 300, regular: 400, normal: 400, book: 400, medium: 500, semibold: 600, demibold: 600, bold: 700, extrabold: 800, ultrabold: 800, black: 900, heavy: 900 };
  for (const k of Object.keys(map)) if (lower.replace(/\s+/g, "").includes(k)) { weight = map[k]; break; }
  const num = lower.match(/\b(\d{3,4})\b/);
  if (num) weight = +num[1];
  return { weight, style: italic ? "italic" : "normal" };
}
function escape(s) { return String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"})[c]); }

// =============================================================
//  PREVIEW LOADER (lazy via IntersectionObserver)
//  На больших документах открыто сразу N×M строк — без обсёрвера это N×M
//  параллельных fetch к jsdelivr, что душит и CDN и UI. Грузим только то,
//  что реально попало во viewport главного скролл-контейнера.
// =============================================================
const _previewObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          _previewObserver.unobserve(entry.target);
          loadRowPreview(entry.target);
        }
      }
    }, { root: document.querySelector("main"), rootMargin: "200px 0px", threshold: 0.01 })
  : null;

function observeRowPreview(row) {
  if (_previewObserver) _previewObserver.observe(row);
  else loadRowPreview(row); // fallback на старых движках
}

async function loadRowPreview(row) {
  const prev = row.querySelector("[data-preview]");
  if (!prev || !prev.classList.contains("loading")) return;
  try {
    const family = row.dataset.family;
    const weight = +row.dataset.weight;
    const style = row.dataset.style;
    const source = row.dataset.source;
    const vendor = row.dataset.vendor;

    let bytes;
    if (source === "catalog") {
      let url = row.dataset.url;
      if (!url && vendor === "fontshare") {
        const cat = STARTER_CATALOG.find(c => c.family === family && c.source === "fontshare");
        if (cat) {
          url = await resolveCatalogUrl(cat, weight, style);
          row.dataset.url = url;
        }
      }
      if (!url) throw new Error("URL не найден");
      bytes = await fetchFont(url);
    } else {
      // user upload
      const u = state.uploaded.find(x => x.family === family);
      const s = u && u.styles.find(s => s.weight === weight && s.style === style);
      if (!s) return;
      bytes = s.bytes;
    }
    const cssFam = await ensureFontFace(family, weight, style, bytes);
    prev.style.fontFamily = `'${cssFam}', sans-serif`;
    prev.style.fontWeight = String(weight);
    prev.style.fontStyle = style;
    prev.style.fontSize = state.size + "px";
    prev.textContent = state.sample;
    prev.classList.remove("loading");
    // запомним bytes для скачивания
    row.__bytes = bytes;
  } catch (e) {
    prev.textContent = "не удалось загрузить (" + (e.message || e) + ")";
    prev.style.color = "var(--warn)";
    prev.classList.remove("loading");
  }
}

//  EVENT BINDING
// =============================================================
// Объявляем FS_SUPPORTED здесь — до updateFooter() и любых обработчиков,
// которые проверяют наличие File System Access API. Полная реализация
// install-логики ниже в секции ONE-CLICK INSTALL.
const FS_SUPPORTED = typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";

document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
  state.tab = tab.dataset.tab;
  renderTab();
}));

document.querySelectorAll("#scope-group .seg").forEach(btn => btn.addEventListener("click", () => {
  if (btn.disabled) return;
  document.querySelectorAll("#scope-group .seg").forEach(b => b.classList.toggle("active", b === btn));
  state.scope = btn.dataset.scope;
  state.userTouched.clear();
  applySelectionSample();
  autoSelectFromScope();
  renderTab();
  updateScopeInfo();
}));

function updateScopeInfo() {
  const info = $("#scope-info");
  const fonts = currentProjectFonts() || [];
  const totalStyles = fonts.reduce((acc, f) => acc + f.usedStyles.length, 0);
  const missing = fonts.reduce((acc, f) => acc + f.usedStyles.filter(s => !s.available).length, 0);
  if (state.scope === "selection") {
    if (state.scan.selectionCount === 0) {
      info.textContent = "Выделение пустое. Выдели фрейм/группу с текстами — плагин обновится автоматически.";
    } else {
      info.textContent = `В выделении (${state.scan.selectionCount} слой(-ёв)) на странице «${state.scan.pageName}»: ${fonts.length} семейств, ${totalStyles} начертаний (не хватает в ОС: ${missing}).`;
    }
  } else {
    info.textContent = `Во всём документе: ${fonts.length} семейств, ${totalStyles} начертаний (не хватает в ОС: ${missing}).`;
  }
  // disable selection кнопку, если ничего не выделено
  const selBtn = document.querySelector('#scope-group .seg[data-scope="selection"]');
  if (selBtn) selBtn.disabled = state.scan.selectionCount === 0;
}

function autoSelectFromScope() {
  // Сбрасываем только то, что НЕ трогал пользователь, и переустанавливаем по текущему scope.
  // Если юзер вручную снимал/добавлял — оставляем его выбор.
  const fonts = currentProjectFonts() || [];
  const newAuto = new Set();
  for (const f of fonts) {
    const cat = familyMatchesCatalog(f.family);
    if (!cat) continue;
    const subset = subsetFor(cat);
    for (const u of f.usedStyles) {
      const w = nearestWeight(cat.weights, u.weight);
      const s = cat.styles.includes(u.style) ? u.style : "normal";
      const key = selKey(cat.family, w, s);
      newAuto.add(key);
      if (!state.userTouched.has(key)) {
        const url = cat.source === "google" ? googleFontUrl(cat.slug, subset, w, s) : null;
        state.selected.set(key, {
          family: cat.family, weight: w, style: s,
          source: "catalog",
          vendor: cat.source,
          slug: cat.slug,
          url, name: null, bytes: null
        });
      }
    }
  }
  // Удаляем авто-добавленные элементы, которые больше не нужны (юзер не трогал)
  for (const key of [...state.selected.keys()]) {
    if (!newAuto.has(key) && !state.userTouched.has(key)) {
      state.selected.delete(key);
    }
  }
  updateFooter();
}

    url: q => `https://www.dafont.com/search.php?q=${encodeURIComponent(q)}` },

    url: q => `https://fontesk.com/?s=${encodeURIComponent(q)}` },
  { id: "google-search",label: "Google поиск", note: "общий поиск «<имя> font free download»",
    url: q => `https://www.google.com/search?q=${encodeURIComponent(q + " font free download")}` }
];

function openExternal(url) {
  // Просим main thread открыть ссылку через figma.openExternal —
  // это правильный путь для Figma plugin sandbox (target=_blank в iframe
  // часто блокируется). Fallback на window.open для случаев когда плагин
  // запущен вне Figma (тестовый веб-просмотр).
  parent.postMessage({ pluginMessage: { type: "open-external", url } }, "*");
  try { window.open(url, "_blank", "noopener,noreferrer"); } catch (_) {}
}

// =============================================================
//  FONTSOURCE LIST — автопоиск в open-source каталоге.
//  Список шрифтов кешируется в figma.clientStorage на 24ч.
// =============================================================
const FONTSOURCE_CACHE_KEY = "fontsource-list-v1";
const FONTSOURCE_CACHE_TTL = 24 * 3600 * 1000;
let fontsourceListPromise = null;
let fontsourceListMem = null;

function _fontsourceFromCache(payload) {
  if (!payload || !payload.list || !payload.fetched) return null;
  if (Date.now() - payload.fetched > FONTSOURCE_CACHE_TTL) return null;
  if (!Array.isArray(payload.list)) return null;
  return payload.list;
}

async function fetchFontsourceList() {
  if (fontsourceListMem) return fontsourceListMem;
  if (fontsourceListPromise) return fontsourceListPromise;
  fontsourceListPromise = (async () => {
    // 1) clientStorage
    const cached = await new Promise(resolve => {
      const handler = (e) => {
        const m = e.data && e.data.pluginMessage;
        if (m && m.type === "fontsource-cache") { window.removeEventListener("message", handler); resolve(m.payload); }
      };
      window.addEventListener("message", handler);
      parent.postMessage({ pluginMessage: { type: "load-fontsource-cache" } }, "*");
      setTimeout(() => { window.removeEventListener("message", handler); resolve(null); }, 1500);
    });
    const fromCache = _fontsourceFromCache(cached);
    if (fromCache) { fontsourceListMem = fromCache; return fromCache; }
    // 2) сеть
    const r = await fetch("https://api.fontsource.org/v1/fonts");
    if (!r.ok) throw new Error(`Fontsource API HTTP ${r.status}`);
    const list = await r.json();
    if (!Array.isArray(list)) throw new Error("Fontsource API: неожиданный формат");
    fontsourceListMem = list;
    parent.postMessage({ pluginMessage: { type: "save-fontsource-cache", payload: { list, fetched: Date.now() } } }, "*");
    return list;
  })().finally(() => { fontsourceListPromise = null; });
  return fontsourceListPromise;
}

function searchFontsource(query, list) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const norm = q.replace(/\s+/g, "");
  const out = [];
  for (const f of list) {
    const fam = (f.family || "").toLowerCase();
    const famNorm = fam.replace(/\s+/g, "");
    let score = 0;
    if (fam === q || famNorm === norm) score = 100;
    else if (fam.startsWith(q) || famNorm.startsWith(norm)) score = 80;
    else if (fam.includes(q) || famNorm.includes(norm)) score = 50;
    if (score > 0) out.push({ ...f, _score: score });
  }
  out.sort((a, b) => b._score - a._score || a.family.localeCompare(b.family));
  return out.slice(0, 30);
}

// Чистим имя шрифта от фуфайки: «[Rus by me]», «(by NN)», foundry-маркеры
// (BT/MT/ITC/Std/Pro/...), weight/style/width маркеры — оставляем чистое
// имя семейства, по которому реально стоит искать в каталогах.
function normalizeQuery(q) {
  let s = String(q || "");
  s = s.replace(/\[[^\]]*\]/g, " ").replace(/\([^)]*\)/g, " "); // [...] (...)
  // foundry/sub-family суффиксы (PT не трогаем — это часть имени PT Sans/Serif/Mono в Fontsource)
  s = s.replace(/\b(BT|MT|ITC|FB|FF|MS|Std|Pro|LT|TT|OT|Bitstream|URW|Adobe|Linotype|Monotype|Berthold|Paratype)\b/gi, " ");
  // weight markers (Lt = Light, Bd = Bold, и т.д.)
  s = s.replace(/\b(Thin|Hairline|UltraLight|ExtraLight|Light|Lt|Regular|Reg|Normal|Book|Medium|Md|SemiBold|DemiBold|Bold|Bd|ExtraBold|UltraBold|Black|Bk|Heavy|Hv|ExtraBlack)\b/gi, " ");
  // style markers
  s = s.replace(/\b(Italic|Ital|It|Oblique|Slanted|Roman|Upright)\b/gi, " ");
  return s.replace(/\s+/g, " ").trim();
}

// Когда точного совпадения нет — пытаемся понять «класс» шрифта по
// самому имени и подсунуть похожие по стилю из open-source каталога.
function guessSimilarFonts(name, list) {
  const lower = String(name || "").toLowerCase();
  let candidates = [];
  if (/compact|condens|narrow|compress|impact/.test(lower)) {
    candidates = ["Bebas Neue", "Anton", "Oswald", "Yanone Kaffeesatz", "Saira Condensed", "Roboto Condensed", "PT Sans Narrow", "Fjalla One", "Big Shoulders Display", "Tektur"];
  } else if (/display|poster|fat|black|heavy|chunky/.test(lower)) {
    candidates = ["Bagel Fat One", "Anton", "Bebas Neue", "Bowlby One", "Fugaz One", "Stalinist One", "Russo One", "Yeseva One", "Forum", "Ultra"];
  } else if (/script|hand|brush|caligraph|cursiv/.test(lower)) {
    candidates = ["Caveat", "Pacifico", "Lobster", "Marck Script", "Bad Script", "Dancing Script", "Sacramento", "Tangerine", "Allura"];
  } else if (/serif|garamond|times|baskerville|caslon|didot|bodoni/.test(lower)) {
    candidates = ["PT Serif", "Playfair Display", "Merriweather", "Lora", "EB Garamond", "Cormorant", "Old Standard TT", "Tinos", "Marcellus"];
  } else if (/mono|code|courier|console|terminal/.test(lower)) {
    candidates = ["JetBrains Mono", "Fira Code", "IBM Plex Mono", "Source Code Pro", "Roboto Mono", "PT Mono", "Anonymous Pro"];
  } else if (/slab/.test(lower)) {
    candidates = ["Roboto Slab", "Bitter", "Vollkorn", "Crimson Pro"];
  } else if (/grotesk|grotesque|sans/.test(lower)) {
    candidates = ["Inter", "Manrope", "Onest", "Jost", "DM Sans", "Hanken Grotesk", "Albert Sans", "Plus Jakarta Sans"];
  }
  if (!candidates.length) return [];
  const lookup = new Set(candidates.map(c => c.toLowerCase()));
  return list.filter(f => lookup.has((f.family || "").toLowerCase())).slice(0, 12);
}

function _humanWeights(weights) {
  if (!weights || !weights.length) return "";
  const min = Math.min(...weights), max = Math.max(...weights);
  if (min === max) return weightLabel(min);
  return `${weightLabel(min)}…${weightLabel(max)} (${weights.length})`;
}

async function showFindFontModal(family) {
  $("#find-modal-name").textContent = family;
  const status = $("#find-modal-status");
  const results = $("#find-modal-results");
  const links = $("#find-modal-links");
  status.textContent = "Ищу в открытых каталогах…";
  status.style.color = "var(--text-soft)";
  results.innerHTML = "";
  // фоллбек-ссылки (для proprietary шрифтов или если автопоиск ничего не дал)
  links.innerHTML = FIND_SOURCES.map(s => {
    const url = s.url(family);
    return `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer" class="find-link" data-find-url="${escape(url)}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg-soft);color:var(--text);text-decoration:none;font-size:12px;transition:border-color 0.15s">
      <span><b style="color:var(--accent)">${escape(s.label)}</b> <span style="color:var(--text-soft);font-size:11px">— ${escape(s.note)}</span></span>
      <span style="color:var(--text-soft);font-size:14px">↗</span>
    </a>`;
  }).join("");
  $("#find-modal-bg").classList.add("open");

  // запускаем поиск
  let list;
  try { list = await fetchFontsourceList(); }
  catch (e) {
    status.textContent = "Не удалось загрузить open-source каталог: " + (e.message || e);
    status.style.color = "var(--warn)";
    return;
  }

  // Каскад: точно → нормализованное имя → первое слово → похожие по стилю.
  let matches = searchFontsource(family, list);
  let usedQuery = family;
  let suggestion = false;

  if (!matches.length) {
    const cleaned = normalizeQuery(family);
    if (cleaned && cleaned.toLowerCase() !== family.toLowerCase()) {
      const m2 = searchFontsource(cleaned, list);
      if (m2.length) { matches = m2; usedQuery = cleaned; }
    }
  }
  if (!matches.length) {
    const cleaned = normalizeQuery(family);
    const first = (cleaned || family).split(/\s+/)[0];
    if (first && first.length >= 3 && first.toLowerCase() !== family.toLowerCase()) {
      const m3 = searchFontsource(first, list);
      if (m3.length) { matches = m3; usedQuery = first; }
    }
  }
  if (!matches.length) {
    const sim = guessSimilarFonts(family, list);
    if (sim.length) { matches = sim; suggestion = true; }
  }

  if (!matches.length) {
    status.innerHTML = `Ничего не найдено в open-source каталоге <b>(${list.length} шрифтов)</b>. Возможно, это коммерческий или самодельный шрифт — попробуй ссылки ниже.`;
    return;
  }

  if (suggestion) {
    status.innerHTML = `Точного совпадения нет — но по стилю имени могут подойти эти бесплатные альтернативы (<b style="color:var(--accent)">${matches.length}</b>):`;
  } else if (usedQuery !== family) {
    status.innerHTML = `Найдено по очищенному запросу «<b>${escape(usedQuery)}</b>»: <b style="color:var(--accent)">${matches.length}</b>`;
  } else {
    status.innerHTML = `Найдено в open-source каталоге: <b style="color:var(--accent)">${matches.length}</b>`;
  }
  renderFindResults(matches);
}

function renderFindResults(matches) {
  const results = $("#find-modal-results");
  results.innerHTML = matches.map(f => {
    const id = String(f.id || "");
    const fam = String(f.family || "");
    const wCount = (f.weights || []).length;
    const sCount = (f.styles || []).length;
    const variants = wCount * sCount;
    const subsetTag = (f.subsets || []).includes("cyrillic")
      ? `<span class="badge ok" style="font-size:9px">cyr</span>` : "";
    const cat = f.category ? `<span class="badge" style="font-size:9px">${escape(f.category)}</span>` : "";
    // вес для превью: 400 если есть, иначе ближайший к 400
    const weights = f.weights || [400];
    const previewWeight = weights.includes(400) ? 400 : nearestWeight(weights, 400);
    const styles = f.styles || ["normal"];
    const previewStyle = styles.includes("normal") ? "normal" : styles[0];
    const subset = (f.subsets || []).includes("cyrillic") ? "cyrillic" : "latin";
    return `<div class="find-result" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:5px;background:var(--bg-soft)">
      <div style="flex:1;min-width:0;overflow:hidden">
        <div style="font-weight:700;font-size:13px;letter-spacing:-0.01em">${escape(fam)}</div>
        <div class="find-preview loading" data-id="${escape(id)}" data-family="${escape(fam)}" data-subset="${subset}" data-weight="${previewWeight}" data-style="${previewStyle}" style="font-size:18px;line-height:1.25;margin:6px 0 4px;color:var(--text-soft);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">загружаю превью…</div>
        <div style="font-size:10px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.08em;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span>${variants} нач.</span>
          <span>${escape(_humanWeights(f.weights || []))}</span>
          ${subsetTag}
          ${cat}
        </div>
      </div>
      <button class="primary find-download-btn" data-id="${escape(id)}" data-family="${escape(fam)}" style="flex-shrink:0;padding:6px 10px;font-size:11px">Скачать</button>
    </div>`;
  }).join("");
  // подгружаем превью параллельно
  results.querySelectorAll(".find-preview.loading").forEach(loadFindPreview);
}

async function loadFindPreview(el) {
  if (!el || !el.classList.contains("loading")) return;
  try {
    const id = el.dataset.id;
    const family = el.dataset.family;
    const weight = +el.dataset.weight;
    const style = el.dataset.style;
    const subset = el.dataset.subset || "latin";
    const url = googleFontUrl(id, subset, weight, style);
    const bytes = await fetchFont(url);
    const cssFam = await ensureFontFace(family, weight, style, bytes);
    el.style.fontFamily = `'${cssFam}', sans-serif`;
    el.style.fontStyle = style;
    el.style.fontWeight = String(weight);
    el.style.color = "var(--text)";
    el.textContent = state.sample || family;
    el.classList.remove("loading");
  } catch (e) {
    el.textContent = "превью недоступно";
    el.style.color = "var(--warn)";
    el.classList.remove("loading");
  }
}

async function downloadFontsourceFamily(id, family) {
  const list = await fetchFontsourceList();
  const f = list.find(x => x.id === id);
  if (!f) { alert("Шрифт не найден в каталоге."); return; }
  const weights = f.weights || [400];
  const styles = f.styles || ["normal"];
  const subset = (f.subsets || []).includes("cyrillic") ? "cyrillic" : "latin";
  const variants = [];
  for (const w of weights) for (const s of styles) variants.push({ w, s });
  if (!variants.length) { alert("Нет доступных начертаний."); return; }
  // оценка: средний ttf на subset ≈ 70 KB
  const estMB = (variants.length * 70 / 1024).toFixed(1);
  if (!confirm(`Скачать «${family}» — ${variants.length} начертаний (≈ ${estMB} MB) в ZIP-архиве?`)) return;

  $("#find-modal-bg").classList.remove("open");
  setProgress(2);
  const entries = [];
  const failed = [];
  let i = 0;
  for (const v of variants) {
    i++;
    setProgress(Math.round((i / variants.length) * 90));
    const url = googleFontUrl(id, subset, v.w, v.s);
    try {
      const bytes = await fetchFont(url);
      const safeFam = family.replace(/[^\w\-А-Яа-яЁё ]/g, "").replace(/\s+/g, "");
      const fname = `${safeFam}/${safeFam}-${v.w}${v.s === "italic" ? "Italic" : ""}.ttf`;
      entries.push({ name: fname, data: bytes });
    } catch (err) {
      failed.push(`${family} ${v.w} ${v.s}: ${err.message || err}`);
    }
  }
  if (!entries.length) {
    setProgress(0);
    alert("Не удалось скачать ни одного начертания.\n\n" + failed.slice(0, 5).join("\n"));
    return;
  }
  const zip = buildZip(entries);
  setProgress(95);
  const blob = new Blob([zip], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const filename = `${family.replace(/[^\w\-]/g, "")}-${new Date().toISOString().slice(0,10)}.zip`;
  let triggered = false;
  try {
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); triggered = true;
    setTimeout(() => { try { a.remove(); } catch (_) {} }, 2000);
  } catch (_) {}
  setProgress(100); setTimeout(() => setProgress(0), 600);
  showInstallHint(entries.length, { url, filename, failed, triggered });
  parent.postMessage({ pluginMessage: { type: "notify", text: `«${family}» — скачано ${entries.length} начертаний.` } }, "*");
}

$("#find-modal-bg").addEventListener("click", (e) => {
  // клик по бэкграунду закрывает модалку
  if (e.target.id === "find-modal-bg") { $("#find-modal-bg").classList.remove("open"); return; }
  // клик по результату Fontsource — скачивание после подтверждения
  const dlBtn = e.target.closest(".find-download-btn");
  if (dlBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = dlBtn.dataset.id;
    const family = dlBtn.dataset.family;
    dlBtn.disabled = true;
    dlBtn.textContent = "Загрузка…";
    downloadFontsourceFamily(id, family).catch(err => {
      console.error("[fonts-plugin] fontsource download failed", err);
      alert("Не удалось скачать: " + (err.message || err));

function bindDrop() {
  const dz = $("#drop"); if (!dz) return;
  const fi = $("#file-input");
  dz.addEventListener("click", () => fi.click());
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", async e => {
    e.preventDefault(); dz.classList.remove("drag");
    await handleFiles([...e.dataTransfer.files]);
  });
  fi.addEventListener("change", async e => { await handleFiles([...e.target.files]); fi.value = ""; });
}

async function handleFiles(files) {
  setProgress(5);
  const skipped = [];
  for (const file of files) {
    try {
      if (file.size > MAX_FILE_BYTES * 5) { // user-ZIP может быть до 50 MB
        skipped.push(`${file.name}: слишком большой (${(file.size/1024/1024).toFixed(1)} MB)`);
        continue;
      }
      if (file.name.toLowerCase().endsWith(".zip")) {
        const buf = await file.arrayBuffer();
        const entries = await readZip(buf);
        const fonts = entries
          .filter(e => /\.(ttf|otf|woff2?)$/i.test(e.name) && !e.name.endsWith("/"))
          .map(e => Object.assign({}, e, { name: sanitizeArchivePath(e.name) }))
          .filter(e => e.name);
        ingestUserFonts(fonts, skipped);
      } else if (/\.(ttf|otf|woff2?)$/i.test(file.name)) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        ingestUserFonts([{ name: file.name, data: bytes }], skipped);
      }
    } catch (err) {
      console.error(err);
      skipped.push(`${file.name}: ${err.message}`);
    }
  }
  setProgress(0);
  renderTab();
  if (skipped.length) {
    alert("Пропущено " + skipped.length + " файл(ов):\n\n" + skipped.slice(0, 10).join("\n"));
  }
}

function ingestUserFonts(entries, skipped) {
  for (const e of entries) {
    if (e.data.length > MAX_FILE_BYTES) {
      skipped && skipped.push(`${e.name}: > ${MAX_FILE_BYTES/1024/1024} MB`);
      continue;
    }
    if (!isFontMagic(e.data)) {
      skipped && skipped.push(`${e.name}: не похоже на шрифт (magic bytes)`);
      continue;
    }
    const baseName = e.name.split("/").pop();
    const meta = parseFontFilename(baseName);
    let u = state.uploaded.find(x => x.family.toLowerCase() === meta.family.toLowerCase());
    if (!u) { u = { family: meta.family, slug: "_user", styles: [], source: "user" }; state.uploaded.push(u); }
    if (!u.styles.find(s => s.weight === meta.weight && s.style === meta.style)) {
      u.styles.push({ weight: meta.weight, style: meta.style, name: baseName, bytes: e.data });
    }
  }
}

function parseFontFilename(path) {
  const base = path.split("/").pop().replace(/\.(ttf|otf|woff2?)$/i, "");
  const lower = base.toLowerCase();
  const italic = /italic|oblique/.test(lower);
  const map = { thin: 100, hairline: 100, extralight: 200, ultralight: 200, light: 300, regular: 400, normal: 400, book: 400, medium: 500, semibold: 600, demibold: 600, bold: 700, extrabold: 800, ultrabold: 800, black: 900, heavy: 900 };
  let weight = 400;
  for (const k of Object.keys(map)) if (lower.includes(k)) { weight = map[k]; break; }
  const num = lower.match(/(\d{3,4})/); if (num) weight = +num[1];
  // family — отрезаем хвост с весами/курсивом
  const family = base
    .replace(/[-_ ]?(Thin|ExtraLight|UltraLight|Light|Regular|Normal|Book|Medium|SemiBold|DemiBold|Bold|ExtraBold|UltraBold|Black|Heavy)/gi, "")
    .replace(/[-_ ]?(Italic|Oblique)/gi, "")
    .replace(/[-_ ]?\d{3,4}/g, "")
    .replace(/[-_]+$/, "")
    .replace(/[-_]/g, " ")
    .trim() || base;
  return { family, weight, style: italic ? "italic" : "normal" };
}

// =============================================================
//  ONE-CLICK INSTALL — File System Access API + IndexedDB persist
//  Браузер один раз спрашивает у юзера папку шрифтов; handle хранится в IDB,
//  следующие установки идут без диалога.
//  (FS_SUPPORTED объявлен выше — в секции EVENT BINDING.)
// =============================================================
const IDB_NAME = "volt-fonts";
const IDB_STORE = "handles";
const IDB_KEY = "fontsDir";

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getInstallDirectory(forcePicker) {
  if (!FS_SUPPORTED) throw new Error("FS_NOT_SUPPORTED");
  if (!forcePicker) {
    try {
      const saved = await idbGet(IDB_KEY);
      if (saved) {
        // запросить readwrite-разрешение на сохранённый handle
        const perm = await saved.queryPermission({ mode: "readwrite" });
        if (perm === "granted") return saved;
        const req = await saved.requestPermission({ mode: "readwrite" });
        if (req === "granted") return saved;
      }
    } catch (e) {
      console.warn("[fonts-plugin] saved dir handle invalid", e);
    }
  }
  // показать picker
  const os = detectOS();
  const opts = { mode: "readwrite" };
  // startIn: best-guess — на Mac обычно "documents"; настоящая ~/Library/Fonts
  // в picker недоступна как стартовая директория, юзер навигирует руками.
  const handle = await window.showDirectoryPicker(opts);
  await idbSet(IDB_KEY, handle);
  return handle;
}

async function writeFontFile(dirHandle, name, bytes) {
  const safeName = sanitizeArchivePath(name).split("/").pop() || "font.ttf";
  const fileHandle = await dirHandle.getFileHandle(safeName, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(bytes);
  await writable.close();
  return safeName;
}

async function onInstall() {
  console.log("[fonts-plugin] onInstall start; selected:", state.selected.size);
  if (!state.selected.size) {
    alert("Ничего не выбрано. Поставь чекбоксы напротив нужных начертаний.");
    return;
  }
  if (!FS_SUPPORTED) {
    alert(`Прямая установка недоступна в этой версии Figma.\n\nЭто потому что Figma Desktop ниже сборки 124, или плагин запущен в окружении без File System Access API.\n\nИспользуй кнопку «ZIP» — после скачивания распакуй и установи руками. Полная инструкция — в модалке после скачивания.`);
    return;
  }

  const btn = $("#install");
  btn.disabled = true;
  setProgress(2);

  let dirHandle;
  try {
    dirHandle = await getInstallDirectory(false);
  } catch (err) {
    console.error("[fonts-plugin] dir picker", err);
    setProgress(0); btn.disabled = false;
    if (err && err.name === "AbortError") return; // юзер закрыл диалог
    alert("Не удалось получить доступ к папке: " + (err.message || err));
    return;
  }

  // Сначала собираем bytes (re-using fetch logic), потом пишем в директорию
  const installed = [];
  const failed = [];
  let i = 0;
  try {
    for (const [, item] of state.selected) {
      i++;
      setProgress(Math.round((i / state.selected.size) * 90));
      let bytes = item.bytes;
      let url = item.url;
      if (!bytes && !url && item.vendor === "fontshare") {
        try {
          const cat = STARTER_CATALOG.find(c => c.family === item.family && c.source === "fontshare");
          if (cat) url = await resolveCatalogUrl(cat, item.weight, item.style);
        } catch (err) {
          failed.push(`${item.family} ${item.weight}: ${err.message}`); continue;
        }
      }
      if (!bytes && url) {
        try { bytes = await fetchFont(url); }
        catch (err) { failed.push(`${item.family} ${item.weight}: ${err.message}`); continue; }
      }
      if (!bytes) { failed.push(`${item.family} ${item.weight}: нет данных`); continue; }
      if (!isFontMagic(bytes)) { failed.push(`${item.family} ${item.weight}: bad magic`); continue; }

      const safeFam = item.family.replace(/[^\w\-А-Яа-яЁё ]/g, "").replace(/\s+/g, "");
      const ext = item.source === "user" && item.name && /\.(otf|woff2?)$/i.test(item.name)
        ? item.name.match(/\.(otf|woff2?)$/i)[0] : ".ttf";
      const fname = `${safeFam}-${item.weight}${item.style === "italic" ? "Italic" : ""}${ext}`;

      try {
        const written = await writeFontFile(dirHandle, fname, bytes);
        installed.push(written);
      } catch (err) {
        console.error("[fonts-plugin] write failed", fname, err);
        failed.push(`${fname}: ${err.message}`);
      }
    }
    setProgress(100);
    setTimeout(() => setProgress(0), 600);

    showInstalledHint(installed, failed, dirHandle.name || "");
    btn.disabled = false;
    parent.postMessage({ pluginMessage: { type: "notify", text: `Установлено ${installed.length} шрифтов в систему. Перезапусти Figma.` } }, "*");
  } catch (e) {
    console.error("[fonts-plugin] onInstall error", e);
    setProgress(0);
    btn.disabled = false;
    alert("Ошибка при установке:\n" + (e && e.message || e));
  }
}

function showInstalledHint(installed, failed, dirName) {
  const os = detectOS();
  const fontsDir = os === "mac" ? "~/Library/Fonts/" : (os === "win" ? "%LOCALAPPDATA%\\Microsoft\\Windows\\Fonts" : "выбранную папку");
  const right = installed.length > 0;
  const wrong = installed.length === 0;
  const failedHtml = failed.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--warn)">Не установлено: ${failed.length}</summary><ul style="margin:6px 0 0 18px;font-size:11px">${failed.slice(0, 10).map(x => `<li>${escape(x)}</li>`).join("")}</ul></details>`
    : "";
  const dirHint = dirName ? `<p style="color:var(--muted)">Папка: <code>${escape(dirName)}</code></p>` : "";
  const wrongPathWarn = (dirName && fontsDir && dirName.toLowerCase() !== "fonts" && !/font/i.test(dirName))
    ? `<p style="color:var(--warn);background:rgba(255,71,51,0.08);padding:8px 10px;border-radius:6px;border:1px solid rgba(255,71,51,0.3)">⚠️ Папка <code>${escape(dirName)}</code> не похожа на системную папку шрифтов. Если шрифты не появились в Figma — нажми кнопку <b>«Сменить папку»</b> и выбери <code>${escape(fontsDir)}</code>.</p>`
    : "";
  const body = right
    ? `
      <p>Установлено <b style="color:var(--accent)">${installed.length}</b> шрифтов прямо в систему.</p>
      ${dirHint}
      ${wrongPathWarn}
      <ol>
        <li><b>Перезапусти Figma Desktop</b> — без рестарта новые семейства не появятся.</li>
        <li>${os === "mac" ? "На macOS Figma подхватит шрифты из <code>~/Library/Fonts/</code> автоматически после рестарта." : "На Windows шрифты в <code>%LOCALAPPDATA%\\Microsoft\\Windows\\Fonts</code> работают без админа."}</li>
        <li>Если используешь Figma в браузере — обнови вкладку.</li>
      </ol>
      ${failedHtml}
    `
    : `<p style="color:var(--warn)">Ни один шрифт не установлен.</p>${failedHtml}`;
  $("#modal-title").textContent = right ? "⚡ Установлено" : "Не удалось установить";
  $("#modal-body").innerHTML = body;
  $("#modal-bg").classList.add("open");
}

async function onDownload() {
  console.log("[fonts-plugin] onDownload start; selected:", state.selected.size);
  if (!state.selected.size) {
    alert("Ничего не выбрано. Поставь чекбоксы напротив нужных начертаний.");
    return;
  }
  const btn = $("#download");
  btn.disabled = true;
  setProgress(2);

  const entries = [];
  const failed = [];
  let i = 0;
  try {
    for (const [, item] of state.selected) {
      i++;
      setProgress(Math.round((i / state.selected.size) * 90));
      let bytes = item.bytes;
      let url = item.url;
      if (!bytes && !url && item.vendor === "fontshare") {
        try {
          const cat = STARTER_CATALOG.find(c => c.family === item.family && c.source === "fontshare");
          if (cat) url = await resolveCatalogUrl(cat, item.weight, item.style);
        } catch (err) {
          console.error("[fonts-plugin] fontshare resolve failed", item.family, err);
          failed.push(`${item.family} ${item.weight} ${item.style}: ${err.message || err}`);
          continue;
        }
      }
      if (!bytes && url) {
        try {
          console.log("[fonts-plugin] fetching", url);
          bytes = await fetchFont(url);
        } catch (err) {
          console.error("[fonts-plugin] fetch failed", url, err);
          failed.push(`${item.family} ${item.weight} ${item.style}: ${err.message || err}`);
          continue;
        }
      }
      if (!bytes) { failed.push(`${item.family} ${item.weight} ${item.style}: нет данных`); continue; }
      // user-upload-байты не проходят через fetchFont, поэтому ещё раз проверяем magic.
      if (!isFontMagic(bytes)) {
        failed.push(`${item.family} ${item.weight} ${item.style}: некорректные magic bytes`);
        continue;
      }
      const safeFam = item.family.replace(/[^\w\-А-Яа-яЁё ]/g, "").replace(/\s+/g, "");
      const ext = item.source === "user" && item.name && /\.(otf|woff2?)$/i.test(item.name)
        ? item.name.match(/\.(otf|woff2?)$/i)[0]
        : ".ttf";
      const fname = `${safeFam}/${safeFam}-${item.weight}${item.style === "italic" ? "Italic" : ""}${ext}`;
      entries.push({ name: fname, data: bytes });
    }
    const totalBytes = entries.reduce((acc, e) => acc + e.data.length, 0);
    if (totalBytes > MAX_TOTAL_BYTES) {
      setProgress(0); btn.disabled = false;
      alert(`Слишком большой ZIP: ${(totalBytes/1024/1024).toFixed(1)} MB > ${MAX_TOTAL_BYTES/1024/1024} MB.\n\nСними часть начертаний или загружай по частям.`);
      return;
    }
    console.log("[fonts-plugin] fetched", entries.length, "of", state.selected.size, "; failed:", failed.length);

    if (!entries.length) {
      setProgress(0); btn.disabled = false;
      alert("Не удалось получить ни одного шрифта.\n\n" + failed.slice(0, 5).join("\n"));
      return;
    }

    const zip = buildZip(entries);
    console.log("[fonts-plugin] zip size:", zip.length, "bytes");
    setProgress(95);
    const blob = new Blob([zip], { type: "application/zip" });
    const url = URL.createObjectURL(blob);
    const filename = `project-fonts-${new Date().toISOString().slice(0,10)}.zip`;

    // Основной путь: создаём якорь и кликаем.
    let triggered = false;
    try {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      triggered = true;
      setTimeout(() => { try { a.remove(); } catch (_) {} }, 2000);
    } catch (err) {
      console.error("[fonts-plugin] anchor download failed", err);
    }

    setProgress(100);
    setTimeout(() => setProgress(0), 600);

    showInstallHint(entries.length, { url, filename, failed, triggered });
    btn.disabled = false;
    parent.postMessage({ pluginMessage: { type: "notify", text: `ZIP со ${entries.length} начертаниями ${triggered ? "скачан" : "готов — нажми ссылку в окне"}.` } }, "*");
  } catch (e) {
    console.error("[fonts-plugin] onDownload error", e);
    setProgress(0);
    btn.disabled = false;
    alert("Ошибка при сборке ZIP:\n" + (e && e.message || e));
  }
}

// =============================================================
//  OS-AWARE INSTALL HINT
// =============================================================
function detectOS() {
  const ua = navigator.userAgent || "";
  const plat = navigator.platform || "";
  if (/Mac|iPhone|iPad/.test(ua) || /Mac/.test(plat)) return "mac";
  if (/Win/.test(ua) || /Win/.test(plat)) return "win";
  return "other";
}
function showInstallHint(n, info) {
  info = info || {};
  const os = detectOS();
  const fallback = info.url
    ? `<p style="margin-top:10px;padding:10px;background:var(--bg-soft);border-radius:6px"><b>Если файл не появился в Загрузках</b> — Figma могла заблокировать авто-скачивание из песочницы. Жми эту ссылку:<br/><a href="${info.url}" download="${info.filename}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">⬇ ${info.filename}</a></p>`
    : "";
  const failedHtml = info.failed && info.failed.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--warn)">Не удалось получить ${info.failed.length} файл(ов)</summary><ul style="margin:6px 0 0 18px;font-size:11px">${info.failed.slice(0, 10).map(x => `<li>${escape(x)}</li>`).join("")}</ul></details>`
    : "";
  let body = "";
  if (os === "win") {
    body = `
      <p>ZIP со <b>${n}</b> файлами шрифтов ${info.triggered ? "скачан в папку загрузок" : "готов к скачиванию"}.</p>
      ${fallback}
      <ol>
        <li>Распакуй архив.</li>
        <li>Выдели все файлы → ПКМ → <b>«Установить»</b> (для текущего пользователя — без админа) или <b>«Установить для всех пользователей»</b>.</li>
        <li>Альтернатива: скопируй в <code>%LOCALAPPDATA%\\Microsoft\\Windows\\Fonts</code>.</li>
        <li><b>Перезапусти Figma desktop</b> — иначе новые шрифты не подтянутся.</li>
      </ol>
      ${failedHtml}`;
  } else if (os === "mac") {
    body = `
      <p>ZIP со <b>${n}</b> файлами шрифтов ${info.triggered ? "скачан в <code>~/Downloads</code>" : "готов к скачиванию"}.</p>
      ${fallback}
      <ol>
        <li>Распакуй архив (двойной клик).</li>
        <li>Выдели все <code>.ttf</code> → <b>двойной клик</b> → в Книге шрифтов нажми «Установить шрифт». Или просто перетащи всё в окно Книги шрифтов.</li>
        <li>Альтернатива (быстрее): перетащи все файлы в <code>~/Library/Fonts/</code>.</li>
        <li><b>Перезапусти Figma desktop</b> (Cmd+Q, открой заново) — иначе новые шрифты не появятся в списке.</li>
      </ol>
      ${failedHtml}`;
  } else {
    body = `<p>ZIP со <b>${n}</b> файлами ${info.triggered ? "скачан" : "готов"}. Установи шрифты средствами своей ОС и перезапусти Figma.</p>${fallback}${failedHtml}`;
  }
  $("#modal-title").textContent = info.triggered ? "Скачано — что дальше" : "ZIP готов";
  $("#modal-body").innerHTML = body;
  $("#modal-bg").classList.add("open");
}

// =============================================================
//  PLUGIN MESSAGES (from code.js)
// =============================================================
window.onmessage = (e) => {
  const msg = e.data && e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "prefs-loaded") {
    applyLoadedPrefs(msg.prefs);
    return;
  }
  if (msg.type === "scan-result") {
    state.scan.document = msg.document || [];
    state.scan.selection = msg.selection || null;
    state.scan.selectionCount = msg.selectionCount || 0;
    state.scan.pageName = msg.pageName || "";
    state.selectionSample = (msg.selectionSample || "").trim();
    // первый автозапуск: если есть выделение — переключаемся на него.
    if (!state._initialized) {
      state._initialized = true;
      if (state.scan.selectionCount > 0 && state.scan.selection) {
        state.scope = "selection";
        document.querySelectorAll("#scope-group .seg").forEach(b =>
          b.classList.toggle("active", b.dataset.scope === "selection"));
      }
    }
    applySelectionSample();
    autoSelectFromScope();
    updateScopeInfo();
    renderTab();
  } else if (msg.type === "scan-error") {
    main.innerHTML = `<div class="empty" style="color:var(--warn)">Ошибка скана: ${escape(msg.error)}</div>`;
  }
};

// init: сначала просим prefs (sample text, size), потом скан документа
parent.postMessage({ pluginMessage: { type: "load-prefs" } }, "*");
parent.postMessage({ pluginMessage: { type: "scan" } }, "*");
updateFooter();
updateScopeInfo();
</script>
